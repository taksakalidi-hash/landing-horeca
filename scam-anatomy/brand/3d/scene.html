<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;overflow:hidden;background:#05070d}
#wrap{position:relative}
canvas{display:block}
#txt{position:absolute;display:none;font-family:Inter,sans-serif}
#txt h1{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;line-height:.88;letter-spacing:6px;font-size:138px;
 background:linear-gradient(180deg,#ffffff 0%,#dfe6f2 55%,#9aa7bd 100%);-webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 10px 18px rgba(0,0,0,.65))}
#txt h1 .r{background:linear-gradient(180deg,#ff6b74 0%,#e63946 50%,#a3121f 100%);-webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 0 28px rgba(230,57,70,.55))}
#txt p{margin:20px 0 0 4px;font-size:40px;font-weight:600;color:#c3cde0;letter-spacing:.5px}
#txt p b{color:#FFD166;font-weight:800}
#txt .line{width:120px;height:8px;background:#E63946;border-radius:4px;margin:0 0 22px 4px;box-shadow:0 0 24px #E63946}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><div id="wrap"><div id="txt"><div class="line"></div><h1>SCAM <span class="r">ANATOMY</span></h1><p>How scams work. <b>How to stop them.</b></p></div></div>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const mode=new URLSearchParams(location.search).get('mode')||'avatar';
const W=mode==='avatar'?1024:2560, H=mode==='avatar'?1024:1440;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H);r.setPixelRatio(1);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('wrap').prepend(r.domElement);
const scene=new THREE.Scene();
// background gradient
{const c=document.createElement('canvas');c.width=1024;c.height=1024;const g=c.getContext('2d');
 const gr=g.createRadialGradient(512,470,40,512,512,760);gr.addColorStop(0,'#1c3263');gr.addColorStop(.45,'#0c1730');gr.addColorStop(1,'#04060b');
 g.fillStyle=gr;g.fillRect(0,0,1024,1024);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;scene.background=t;}
const pm=new THREE.PMREMGenerator(r);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.4;

const cam=new THREE.PerspectiveCamera(mode==='avatar'?30:26,W/H,0.1,100);

// ---------- phone ----------
const phone=new THREE.Group();
const body=new THREE.Mesh(new RoundedBoxGeometry(1.7,3.4,0.2,8,0.22),
 new THREE.MeshPhysicalMaterial({color:0x0c0f16,metalness:0.9,roughness:0.28,clearcoat:1,clearcoatRoughness:0.08}));
body.castShadow=true;phone.add(body);
// screen texture
const sc=document.createElement('canvas');sc.width=512;sc.height=1024;const g=sc.getContext('2d');
let gr=g.createLinearGradient(0,0,0,1024);gr.addColorStop(0,'#2a0509');gr.addColorStop(.5,'#47080f');gr.addColorStop(1,'#1a0306');
g.fillStyle=gr;g.fillRect(0,0,512,1024);
g.strokeStyle='rgba(255,90,100,.22)';g.lineWidth=2;
for(let x=0;x<=512;x+=48){g.beginPath();g.moveTo(x,0);g.lineTo(x,1024);g.stroke();}
for(let y=0;y<=1024;y+=48){g.beginPath();g.moveTo(0,y);g.lineTo(512,y);g.stroke();}
let rg=g.createRadialGradient(256,470,10,256,470,330);rg.addColorStop(0,'rgba(255,80,90,.75)');rg.addColorStop(1,'rgba(255,80,90,0)');
g.fillStyle=rg;g.fillRect(0,0,512,1024);
g.fillStyle='rgba(255,209,102,.85)';g.fillRect(0,700,512,5);
g.fillStyle='rgba(255,209,102,.18)';g.fillRect(0,640,512,60);
for(let i=0;i<5;i++){g.fillStyle='rgba(255,140,150,.35)';g.fillRect(60,780+i*38,140+((i*97)%250),14);}
g.fillStyle='rgba(255,255,255,.75)';g.fillRect(196,40,120,18);
const st=new THREE.CanvasTexture(sc);st.colorSpace=THREE.SRGBColorSpace;
const screen=new THREE.Mesh(new THREE.PlaneGeometry(1.54,3.22),
 new THREE.MeshPhysicalMaterial({color:0x000000,emissive:0xffffff,emissiveMap:st,emissiveIntensity:1.1,roughness:0.55,clearcoat:0.15,clearcoatRoughness:0.6}));
screen.position.z=0.102;phone.add(screen);
// camera bump on back
const bump=new THREE.Mesh(new RoundedBoxGeometry(0.6,0.6,0.08,4,0.12),body.material);bump.position.set(-0.45,1.25,-0.12);phone.add(bump);
scene.add(phone);

// ---------- warning triangle ----------
function triShape(s,rad){const sh=new THREE.Shape();const pts=[[0,s],[s*0.92,-s*0.62],[-s*0.92,-s*0.62]];
 for(let i=0;i<3;i++){const p=pts[i],n=pts[(i+1)%3],pr=pts[(i+2)%3];
  const a=new THREE.Vector2(...pr).sub(new THREE.Vector2(...p)).normalize().multiplyScalar(rad).add(new THREE.Vector2(...p));
  const b=new THREE.Vector2(...n).sub(new THREE.Vector2(...p)).normalize().multiplyScalar(rad).add(new THREE.Vector2(...p));
  if(i===0)sh.moveTo(a.x,a.y);else sh.lineTo(a.x,a.y);sh.quadraticCurveTo(p[0],p[1],b.x,b.y);}
 sh.closePath();return sh;}
const tri=new THREE.Group();
const triMesh=new THREE.Mesh(new THREE.ExtrudeGeometry(triShape(1,0.22),{depth:0.28,bevelEnabled:true,bevelThickness:0.08,bevelSize:0.06,bevelSegments:8,curveSegments:24}),
 new THREE.MeshPhysicalMaterial({color:0xc8102e,metalness:0.0,roughness:0.22,clearcoat:1,clearcoatRoughness:0.04,emissive:0x3a0005,emissiveIntensity:0.5}));
triMesh.geometry.center();triMesh.castShadow=true;tri.add(triMesh);
const white=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:0.15,clearcoat:1,emissive:0xffffff,emissiveIntensity:0.05});
const barShape=new THREE.Shape();{const w=0.13,t=0.5,bt=-0.08;barShape.moveTo(-w,t);barShape.lineTo(w,t);barShape.lineTo(w*0.7,bt);barShape.lineTo(-w*0.7,bt);barShape.closePath();}
const bar=new THREE.Mesh(new THREE.ExtrudeGeometry(barShape,{depth:0.12,bevelEnabled:true,bevelThickness:0.04,bevelSize:0.04,bevelSegments:6}),white);
bar.position.set(0,-0.05,0.2);tri.add(bar);
const dot=new THREE.Mesh(new THREE.SphereGeometry(0.13,48,48),white);dot.scale.z=0.75;dot.position.set(0,-0.36,0.28);tri.add(dot);
scene.add(tri);

// ---------- shards / particles ----------
const shardMats=[new THREE.MeshPhysicalMaterial({color:0xe63946,roughness:0.2,clearcoat:1,emissive:0x400006}),
 new THREE.MeshPhysicalMaterial({color:0xffd166,roughness:0.25,metalness:0.6,clearcoat:1}),
 new THREE.MeshPhysicalMaterial({color:0x1a2438,roughness:0.15,metalness:0.9})];
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const shards=new THREE.Group();scene.add(shards);
function addShards(n,spread){for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.TetrahedronGeometry(0.06+rnd()*0.12,0),shardMats[i%3]);
 m.position.set((rnd()-.5)*spread[0],(rnd()-.5)*spread[1],(rnd()-.3)*spread[2]);m.rotation.set(rnd()*6,rnd()*6,rnd()*6);shards.add(m);}}

// ---------- lights ----------
const key=new THREE.SpotLight(0xffffff,55,30,0.5,0.6,1.6);key.position.set(-4,6,7);key.castShadow=true;scene.add(key);
const rimR=new THREE.PointLight(0xff2a3c,60,20,1.6);rimR.position.set(4,1.5,-2.5);scene.add(rimR);
const rimB=new THREE.PointLight(0x3d7bff,45,20,1.6);rimB.position.set(-4.5,-1,-2);scene.add(rimB);
const fill=new THREE.PointLight(0xffd8a0,10,20,1.8);fill.position.set(2,-3,5);scene.add(fill);
const glow=new THREE.PointLight(0xff3344,0,6,2);scene.add(glow);

// ---------- layout ----------
if(mode==='avatar'){
 cam.position.set(0,0.1,10.2);cam.lookAt(0,0.05,0);
 phone.position.set(0.35,0.15,-0.6);phone.rotation.set(0.08,-0.42,0.12);
 tri.position.set(-0.15,-0.05,0.9);tri.rotation.set(-0.06,0.28,-0.04);tri.scale.setScalar(1.18);
 glow.position.set(0,0,0.3);
 addShards(18,[5.2,5.2,2.5]);
}else{
 cam.position.set(0,0,17);cam.lookAt(0,0,0);
 phone.position.set(-2.2,0.0,-0.6);phone.rotation.set(0.08,-0.45,0.12);phone.scale.setScalar(0.62);
 tri.position.set(-2.45,-0.16,0.6);tri.rotation.set(-0.05,0.3,-0.04);tri.scale.setScalar(0.72);
 glow.position.set(-4.5,0,0.4);
 // perspective grid floor
 const grid=new THREE.GridHelper(80,80,0x2b3d63,0x16223a);grid.position.y=-3.1;grid.material.transparent=true;grid.material.opacity=0.55;scene.add(grid);
 scene.fog=new THREE.Fog(0x070b14,14,34);
 addShards(34,[19,7,3]);
 shards.children.forEach(s=>{if(s.position.x>-3.6&&s.position.x<6.5&&Math.abs(s.position.y)<1.6)s.position.y+=(s.position.y>0?2:-2);});
 const t=document.getElementById('txt');t.style.display='block';t.style.left='1130px';t.style.top='572px';
}
const comp=new EffectComposer(r);comp.addPass(new RenderPass(scene,cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),0.42,0.5,0.9));comp.addPass(new OutputPass());
comp.render();
await document.fonts.ready;
window.DONE=true;
</script></body></html>
