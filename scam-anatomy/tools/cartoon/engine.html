<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block}text{font-family:Inter,sans-serif}.A{font-family:Anton,Impact,sans-serif;letter-spacing:4px}</style></head>
<body><svg id="sv" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16233f"/><stop offset="1" stop-color="#0d1527"/></linearGradient>
 <linearGradient id="wallDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd8e6"/><stop offset="1" stop-color="#a9b6cb"/></linearGradient>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1330"/><stop offset="1" stop-color="#253a6e"/></linearGradient>
 <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ec5ff"/><stop offset="1" stop-color="#ffe2b8"/></linearGradient>
 <linearGradient id="cc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0b12"/><stop offset="1" stop-color="#07070c"/></linearGradient>
 <radialGradient id="navyBg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#1c3060"/><stop offset=".55" stop-color="#0B1320"/><stop offset="1" stop-color="#04070d"/></radialGradient>
 <radialGradient id="lampPool" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".55"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9cc3ff" stop-opacity=".6"/><stop offset="1" stop-color="#9cc3ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowR" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff3b4e" stop-opacity=".7"/><stop offset="1" stop-color="#ff3b4e" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowG" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3ddc84" stop-opacity=".6"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/></radialGradient>
 <radialGradient id="redVig" cx="50%" cy="50%" r="75%"><stop offset=".5" stop-color="#E63946" stop-opacity="0"/><stop offset="1" stop-color="#E63946" stop-opacity=".8"/></radialGradient>
 <radialGradient id="darkVig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></radialGradient>
 <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#3a5a9a" stroke-opacity=".18" stroke-width="2"/></pattern>
 <pattern id="bp" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9cc3ff" stroke-opacity=".15" stroke-width="1.5"/></pattern>
 <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
 <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<g id="root"></g>
</svg>
<script>
// ---------- helpers ----------
const C={navy:'#0B1320',red:'#E63946',yel:'#FFD166',wh:'#F4F6FB',teal:'#2a9d8f',grn:'#2fb36b',blue:'#2f7cf6',mut:'#8C9AB3',skin:'#efbf97',skinS:'#e3a982'};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E=x=>{x=cl(x);return 1-Math.pow(1-x,3)};
const EIO=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const BK=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const P=(t,a,b)=>cl((t-a)/(b-a));
const pop=(t,a,d=.35)=>BK(P(t,a,a+d));
const fade=(t,a,d=.25)=>E(P(t,a,a+d));
const R=n=>Math.round(n*10)/10;
let SEED=1;const rnd=()=>{SEED=(SEED*16807)%2147483647;return SEED/2147483647};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.fs||40}" fill="${o.c||C.wh}" font-weight="${o.w||700}" text-anchor="${o.a||'start'}" ${o.cls?`class="${o.cls}"`:''} opacity="${o.op??1}" ${o.ls?`letter-spacing="${o.ls}"`:''}>${s}</text>`;
const G=(inner,tr='',op=1,ex='')=>`<g transform="${tr}" opacity="${R(op*100)/100}" ${ex}>${inner}</g>`;
const sc=(x,y,s)=>`translate(${x},${y}) scale(${s}) translate(${-x},${-y})`;
const talkM=(t,on)=>on?cl((0.25+0.75*Math.abs(Math.sin(t*13)))*(0.55+0.45*Math.sin(t*4.7+1)),0,1):0;
const blink=(t,off=0)=>((t+off)%3.7)<0.13?0.1:1;
const typeOn=(s,t,a,cps=28)=>s.slice(0,Math.max(0,Math.floor((t-a)*cps)));

// ---------- backgrounds ----------
function bgNavy(){return `<rect width="1920" height="1080" fill="url(#navyBg)"/><rect width="1920" height="1080" fill="url(#grid)"/>`}
function bgBlueprint(){return `<rect width="1920" height="1080" fill="#0b2a55"/><rect width="1920" height="1080" fill="url(#bp)"/><rect width="1920" height="1080" fill="url(#darkVig)"/>`}
function kitchen(t,day=false,clockMin=42,clockHr=7){
 const w=day?'url(#wallDay)':'url(#wall)',sky=day?'url(#skyDay)':'url(#sky)',dk=day?'#7d8aa3':'#0a1120';
 const m=clockMin,h=clockHr+m/60;
 return `<rect width="1920" height="1080" fill="${w}"/>
 <g transform="translate(1330,140)"><rect width="420" height="440" rx="10" fill="${sky}" stroke="${dk}" stroke-width="22"/>
 ${day?`<circle cx="320" cy="110" r="55" fill="#fff3c4"/>`:`<circle cx="300" cy="110" r="48" fill="#f4f1de"/><g fill="#fff" opacity=".8"><circle cx="80" cy="70" r="3"/><circle cx="160" cy="140" r="2"/><circle cx="60" cy="220" r="2.5"/></g>`}
 <path d="M0 330 L60 280 L110 310 L170 250 L240 300 L300 260 L360 300 L420 270 L420 440 L0 440Z" fill="${day?'#6b86b3':'#0b1633'}"/>
 ${day?'':`<g fill="#ffd166"><rect x="70" y="330" width="10" height="14"/><rect x="200" y="320" width="10" height="14"/><rect x="330" y="335" width="10" height="14"/></g>`}
 <rect x="199" y="0" width="22" height="440" fill="${dk}"/><rect x="0" y="209" width="420" height="22" fill="${dk}"/>
 <path d="M-40 -20 Q20 200 -10 470 L-60 470 L-60 -20Z" fill="#7a2b3a"/><path d="M460 -20 Q400 200 430 470 L480 470 L480 -20Z" fill="#7a2b3a"/></g>
 <g transform="translate(1080,210)"><circle r="78" fill="#f4f1de" stroke="${dk}" stroke-width="10"/>
 <g stroke="${dk}" stroke-width="5"><line y1="-62" y2="-50"/><line y1="62" y2="50"/><line x1="-62" x2="-50"/><line x1="62" x2="50"/></g>
 <line y2="-36" stroke="${dk}" stroke-width="9" stroke-linecap="round" transform="rotate(${(h%12)*30})"/><line y2="-56" stroke="${C.red}" stroke-width="5" stroke-linecap="round" transform="rotate(${m*6})"/><circle r="7" fill="${dk}"/></g>
 <rect x="170" y="330" width="360" height="16" rx="4" fill="${dk}"/><rect x="200" y="270" width="70" height="60" rx="8" fill="#3d5a80"/><rect x="290" y="250" width="50" height="80" rx="6" fill="${C.red}" opacity=".8"/>
 <path d="M420 330 q-10 -60 10 -90 q20 30 10 90z M440 330 q10 -70 50 -80 q-10 50 -40 80z M425 330 q-40 -40 -70 -40 q20 40 70 40z" fill="${C.teal}"/><rect x="405" y="300" width="60" height="30" rx="6" fill="#e07a5f"/>
 <line x1="760" y1="0" x2="760" y2="130" stroke="${dk}" stroke-width="6"/><path d="M690 130 Q760 80 830 130 L860 190 L660 190Z" fill="#e9c46a"/>
 ${day?'':`<path d="M660 190 L860 190 L1180 900 L340 900Z" fill="url(#lampPool)"/>`}`;
}
function table(){return `<rect x="0" y="860" width="1920" height="220" fill="#3b2f2f"/><rect x="0" y="860" width="1920" height="16" fill="#4e3d3d"/>
 <g transform="translate(1250,800)"><path d="M0 0 h70 v60 q0 20 -20 20 h-30 q-20 0 -20 -20z" fill="#f4f1de"/><path d="M70 15 q30 0 30 20 q0 20 -30 20" fill="none" stroke="#f4f1de" stroke-width="10"/></g>`}
function callcenter(t,red=0){
 let s=`<rect width="1920" height="1080" fill="url(#cc)"/>`;
 // back row of scammer silhouettes with monitors
 for(let i=0;i<7;i++){const x=120+i*280,y=470;const bob=Math.sin(t*2+i)*3;
  s+=`<rect x="${x-70}" y="${y-110}" width="140" height="90" rx="8" fill="#1b2a44"/><rect x="${x-62}" y="${y-102}" width="124" height="74" rx="4" fill="${i%2?'#3a6ea5':'#7a2b3a'}" opacity=".85"/>
  <circle cx="${x}" cy="${y+bob-10}" r="34" fill="#0d0d14"/><path d="M${x-60} ${y+120} Q${x-60} ${y+30+bob} ${x} ${y+30+bob} Q${x+60} ${y+30+bob} ${x+60} ${y+120}Z" fill="#0d0d14"/>
  <path d="M${x-36} ${y-14+bob} q36 -44 72 0" fill="none" stroke="#22222e" stroke-width="7"/>`;}
 s+=`<rect x="0" y="560" width="1920" height="40" fill="#14141c"/>`;
 s+=`<rect width="1920" height="1080" fill="${C.red}" opacity="${0.08+0.12*red*(0.6+0.4*Math.sin(t*8))}"/>`;
 return s;
}
// ---------- characters ----------
const HAIR={
 bob:(c,c2)=>[`<path d="M-112 10 Q-125 -120 0 -128 Q125 -120 112 10 Q118 90 80 100 L-80 100 Q-118 90 -112 10Z" fill="${c}"/>`,`<path d="M-96 -20 Q-90 -110 0 -112 Q90 -110 96 -20 Q60 -70 0 -66 Q-50 -66 -96 -20Z" fill="${c2}"/>`],
 messy:(c,c2)=>['',`<path d="M-98 -6 Q-104 -122 0 -128 Q104 -122 98 -6 Q92 -58 66 -66 L58 -44 L38 -74 L18 -50 L-4 -80 L-24 -52 L-46 -76 L-62 -50 Q-90 -58 -98 -6Z" fill="${c}"/>`],
 curly:(c,c2)=>{let back='',front='';const pts=[[-110,-10],[-118,40],[-104,85],[110,-10],[118,40],[104,85],[-90,-80],[90,-80],[-50,-112],[0,-122],[50,-112]];
  pts.forEach(([x,y])=>back+=`<circle cx="${x}" cy="${y}" r="${y<-60?44:40}" fill="${c}"/>`);[[-60,-78],[-20,-92],[22,-92],[62,-78]].forEach(([x,y])=>front+=`<circle cx="${x}" cy="${y}" r="30" fill="${c2}"/>`);return [back,front]},
};
function denise(o){ // generic character; defaults = Denise. extra: hair,hairC,hairC2,top,top2,glasses,skin,skinS,collar,earrings
 const t=o.t||0,b=Math.sin(t*2.2)*3,bl=o.blink??blink(t,o.bo||0);const w=o.brow||0,wide=o.wide||1,mo=o.mouth||0,shock=o.shock||0;
 const skin=o.skin||C.skin,skinS=o.skinS||C.skinS,top=o.top||C.teal,top2=o.top2||'#23867a',hc=o.hairC||'#c9ccd6',hc2=o.hairC2||(o.hairC?o.hairC:'#dfe2ea');
 const [hb,hf]=HAIR[o.hair||'bob'](hc,hc2);const gl=o.glasses??true;
 const head=`<g transform="translate(${Math.sin(t*0.9)*4},${440+b}) rotate(${(o.tilt||0)+Math.sin(t*.7)*2})">
  ${hb}<ellipse cx="0" cy="10" rx="92" ry="105" fill="${skin}"/>${hf}
  <ellipse cx="-92" cy="18" rx="14" ry="22" fill="${skinS}"/><ellipse cx="92" cy="18" rx="14" ry="22" fill="${skinS}"/>
  ${o.earrings?`<circle cx="-94" cy="46" r="8" fill="${C.yel}"/><circle cx="94" cy="46" r="8" fill="${C.yel}"/>`:''}
  <g stroke="${o.browC||'#7d7f8a'}" stroke-width="7" stroke-linecap="round"><line x1="-58" y1="${-28+6*w}" x2="-22" y2="${-30-14*w}"/><line x1="22" y1="${-30-14*w}" x2="58" y2="${-28+6*w}"/></g>
  <g fill="#1d2433"><ellipse cx="${-40+(o.look||0)}" cy="2" rx="9" ry="${11*bl*wide}"/><ellipse cx="${40+(o.look||0)}" cy="2" rx="9" ry="${11*bl*wide}"/></g>
  ${gl?`<g fill="none" stroke="#1d2433" stroke-width="5"><circle cx="-40" cy="2" r="28"/><circle cx="40" cy="2" r="28"/><line x1="-12" y1="0" x2="12" y2="0"/></g>`:''}
  <path d="M-6 20 Q0 40 8 32" fill="none" stroke="#c98d6c" stroke-width="5" stroke-linecap="round"/>
  ${shock>0?`<ellipse cx="0" cy="66" rx="${16*shock}" ry="${22*shock}" fill="#5a1f24"/>`:
   mo>0.05?`<ellipse cx="0" cy="64" rx="${14+4*mo}" ry="${3+13*mo}" fill="#5a1f24"/>`:
   `<path d="${(o.smile??0)>0?'M-26 58 Q0 82 26 58':(o.smile??0)>=0?'M-22 62 Q0 72 22 62':'M-20 68 Q0 58 20 68'}" fill="none" stroke="#9b3d3d" stroke-width="6" stroke-linecap="round"/>`}
  <g fill="#f4a3a3" opacity=".35"><ellipse cx="-60" cy="40" rx="16" ry="9"/><ellipse cx="60" cy="40" rx="16" ry="9"/></g>
  ${o.sweat?`<path d="M95 ${-40+(t*40)%30} q10 18 0 26 q-10 -8 0 -26z" fill="#9cd3ff" opacity="${o.sweat}"/>`:''}
  ${o.phone==='ear'?`<g transform="translate(108,10) rotate(12)"><rect x="-22" y="-60" width="44" height="100" rx="10" fill="#0b0f18" stroke="#3a4558" stroke-width="4"/></g>`:''}
 </g>`;
 let arms='',ph='';
 if(o.phone==='hands'){const bz=o.buzz?Math.sin(t*120)*6:0;
  arms=`<path d="M-130 680 Q-150 820 -40 830" fill="none" stroke="${top2}" stroke-width="58" stroke-linecap="round"/><path d="M130 680 Q150 820 40 830" fill="none" stroke="${top}" stroke-width="58" stroke-linecap="round"/>`;
  ph=`<g transform="translate(${bz},800) rotate(${bz*.6})"><ellipse cx="0" cy="-30" rx="200" ry="160" fill="url(#glowB)" opacity="${o.glow??.8}"/><rect x="-48" y="-92" width="96" height="170" rx="16" fill="#0b0f18" stroke="#3a4558" stroke-width="5"/><rect x="-38" y="-78" width="76" height="140" rx="8" fill="${o.screen||'#6aa5ff'}"/>
   ${o.buzz?`<g stroke="${C.yel}" stroke-width="5" fill="none" stroke-linecap="round"><path d="M-70 -70 q-12 12 0 24 q12 12 0 24"/><path d="M70 -70 q12 12 0 24 q-12 12 0 24"/></g>`:''}</g>
   <ellipse cx="-45" cy="832" rx="34" ry="26" fill="${skin}"/><ellipse cx="45" cy="832" rx="34" ry="26" fill="${skin}"/>`;
 }else if(o.phone==='ear'){
  arms=`<path d="M-130 680 Q-150 820 -60 850" fill="none" stroke="${top2}" stroke-width="58" stroke-linecap="round"/><path d="M120 640 Q190 600 150 470" fill="none" stroke="${top}" stroke-width="58" stroke-linecap="round"/><ellipse cx="140" cy="460" rx="30" ry="36" fill="${skin}"/>`;
 }else if(o.phone==='type'){const k=Math.sin(t*16)*6;
  arms=`<path d="M-130 680 Q-160 800 -70 ${850+k}" fill="none" stroke="${top2}" stroke-width="58" stroke-linecap="round"/><path d="M130 680 Q160 800 70 ${850-k}" fill="none" stroke="${top}" stroke-width="58" stroke-linecap="round"/><ellipse cx="-70" cy="${862+k}" rx="32" ry="24" fill="${skin}"/><ellipse cx="70" cy="${862-k}" rx="32" ry="24" fill="${skin}"/>`;
 }
 const collar=o.collar===false?`<path d="M-50 592 Q0 640 50 592" fill="none" stroke="${top2}" stroke-width="14"/>`:`<path d="M-40 595 L0 700 L40 595Z" fill="#f4f1de"/>`;
 return `<g transform="translate(${o.x},${o.y||0}) scale(${o.s||1})"><path d="M-170 1000 Q-175 640 -95 600 Q0 570 95 600 Q175 640 170 1000Z" fill="${top}"/>${collar}<path d="M-95 600 Q-60 620 -55 700 L-75 1000 L-170 1000 Q-175 640 -95 600Z" fill="${top2}"/><rect x="-28" y="520" width="56" height="85" rx="20" fill="${skinS}"/>${o.hood?`<path d="M-120 610 Q0 520 120 610 Q90 640 0 600 Q-90 640 -120 610Z" fill="${top2}"/>`:''}${head}${arms}${ph}</g>`;
}
const TYLER={hair:'messy',hairC:'#4a3426',top:'#e76f51',top2:'#c85a3f',glasses:false,skin:'#dba57f',skinS:'#c98f6b',collar:false,hood:true,browC:'#4a3426',bo:.9};
const LINDA={hair:'curly',hairC:'#8d5a3b',hairC2:'#a0694a',top:'#7b5ea7',top2:'#694f92',glasses:false,earrings:true,browC:'#6b4a35',bo:2.1};
const tyler=o=>denise(Object.assign({},TYLER,o));
const linda=o=>denise(Object.assign({},LINDA,o));
function mark(o){ // scammer: x,y,s,t,mouth,brow(anger),smirk,lit
 const t=o.t||0,b=Math.sin(t*2)*3,bl=blink(t,1.3),ang=o.brow||0,mo=o.mouth||0;
 return `<g transform="translate(${o.x},${o.y||0}) scale(${o.s||1})">
 <path d="M-190 1000 Q-190 640 -100 600 Q0 575 100 600 Q190 640 190 1000Z" fill="#2b2d42"/><path d="M-60 600 Q0 660 60 600 L50 640 Q0 690 -50 640Z" fill="#1f2033"/>
 <rect x="-30" y="525" width="60" height="85" rx="20" fill="#c98f6b"/>
 <g transform="translate(${Math.sin(t*.8)*3},${440+b}) rotate(${Math.sin(t*.6)*2})">
  <ellipse cx="0" cy="10" rx="90" ry="108" fill="#d9a37e"/>
  <path d="M-92 -10 Q-100 -120 0 -122 Q100 -120 92 -10 Q80 -70 40 -78 Q0 -60 -40 -78 Q-80 -70 -92 -10Z" fill="#1c1c24"/>
  <ellipse cx="-90" cy="18" rx="13" ry="22" fill="#c98f6b"/><ellipse cx="90" cy="18" rx="13" ry="22" fill="#c98f6b"/>
  <g stroke="#1c1c24" stroke-width="9" stroke-linecap="round"><line x1="-60" y1="${-30-6*ang}" x2="-20" y2="${-26+10*ang}"/><line x1="20" y1="${-26+10*ang}" x2="60" y2="${-30-6*ang}"/></g>
  <g fill="#14141c"><ellipse cx="-38" cy="0" rx="10" ry="${8*bl}"/><ellipse cx="38" cy="0" rx="10" ry="${8*bl}"/></g>
  <path d="M-6 18 Q0 40 8 34" fill="none" stroke="#a8714f" stroke-width="5" stroke-linecap="round"/>
  <path d="M-70 50 Q-60 105 0 112 Q60 105 70 50 Q40 80 0 82 Q-40 80 -70 50Z" fill="#3a2e2e" opacity=".35"/>
  ${mo>0.05?`<ellipse cx="0" cy="66" rx="${16+4*mo}" ry="${3+12*mo}" fill="#3a1414"/>`:`<path d="M-24 64 Q${o.smirk?10:0} ${o.smirk?78:70} 26 ${o.smirk?56:64}" fill="none" stroke="#7a3b3b" stroke-width="6" stroke-linecap="round"/>`}
  <path d="M-104 0 Q-110 -150 0 -150 Q110 -150 104 0" fill="none" stroke="#2a2a35" stroke-width="12"/><rect x="-118" y="-10" width="30" height="56" rx="12" fill="#2a2a35"/><rect x="88" y="-10" width="30" height="56" rx="12" fill="#2a2a35"/>
  <path d="M-104 40 Q-90 100 -30 82" fill="none" stroke="#2a2a35" stroke-width="7"/><circle cx="-28" cy="82" r="10" fill="${C.red}"/>
 </g>
 ${o.lit?`<rect x="-190" y="300" width="380" height="700" fill="${o.lit}" opacity=".12"/>`:''}
 </g>`;
}
function person(x,y,s,col,t=0,face=true){return `<g transform="translate(${x},${y}) scale(${s})"><circle cy="${-150+Math.sin(t*2)*2}" r="55" fill="${face?'#e0b08c':col}"/>${face?`<circle cx="-18" cy="-150" r="6" fill="#1d2433"/><circle cx="18" cy="-150" r="6" fill="#1d2433"/><path d="M-15 -125 Q0 -118 15 -125" stroke="#7a3b3b" stroke-width="5" fill="none"/>`:''}<path d="M-90 60 Q-90 -80 0 -85 Q90 -80 90 60Z" fill="${col}"/></g>`}

// ---------- reusable UI ----------
function bubble(x,y,w,h,inner,o={}){return `<g transform="translate(${x},${y}) scale(${o.s??1})" opacity="${o.op??1}" filter="url(#sh)"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="34" fill="${o.fill||'#26303f'}" ${o.stroke?`stroke="${o.stroke}" stroke-width="6"`:''}/>${o.tail?`<path d="M${-w/2+60} ${h/2-4} l-40 50 l90 -50z" fill="${o.fill||'#26303f'}"/>`:''}${inner}</g>`}
function smsAlert(x,y,s,op){return bubble(x,y,600,300,`${T(-260,-88,'🏦 FRAUD ALERT',{fs:34,c:'#ff6b74',w:800})}${T(-260,-30,'Did you attempt a purchase',{fs:34,w:500})}${T(-260,16,'of <tspan font-weight="800">$1,249.99</tspan>?',{fs:34,w:500})}${T(-260,80,'Reply YES or NO',{fs:36,c:C.yel,w:800})}`,{s,op,stroke:C.red,tail:1})}
